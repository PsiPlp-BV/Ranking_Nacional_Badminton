name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ranking-engine:
    name: Node — motor de ranking (js/ranking.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test

  data-pipeline:
    name: Python — pipeline de datos (scripts/build_data.py)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover scripts

  syntax-check:
    name: Sintaxis de los archivos JS del sitio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          for f in js/*.js; do
            echo "Checking $f"
            node --check "$f"
          done
